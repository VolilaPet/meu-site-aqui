<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Informações de contato | Bem Materno</title>
  <meta name="description" content="Fale com a Bem Materno: e-mail e horário de atendimento.">
  <style>
    @font-face { font-family: Poppins; font-weight: 400; font-display: swap; src: url("assets/2b3ca9d54f2a55.woff2") format("woff2"), url("assets/a59ced8f437ef2.woff") format("woff"); }
    @font-face { font-family: Poppins; font-weight: 700; font-display: swap; src: url("assets/df4675d6f08a78.woff2") format("woff2"), url("assets/bfccfa378bdd62.woff") format("woff"); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Poppins, Arial, sans-serif; color: #111; background: #eef6fc; line-height: 1.6; }
    header { background: #fff; text-align: center; padding: 14px 16px; border-bottom: 1px solid #dbe8f4; }
    header img { width: 150px; height: auto; display: inline-block; }
    main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 26px; line-height: 1.25; margin: 0 0 8px; }
    .lead { margin: 0 0 24px; color: #444; }
    .card { background: #fff; border-radius: 14px; padding: 22px 22px; box-shadow: 0 2px 10px rgba(74, 134, 197, .12); }
    .item { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; }
    .item + .item { border-top: 1px solid #e6eef6; }
    .icon { flex: 0 0 42px; height: 42px; border-radius: 50%; background: #e3effa; color: #4a86c5; display: grid; place-items: center; }
    .icon svg { width: 22px; height: 22px; }
    .label { font-size: 13px; color: #555; margin: 0; }
    .value { font-weight: 700; font-size: 17px; margin: 0; word-break: break-word; }
    .value a { color: #2e5e96; text-decoration: none; white-space: nowrap; }
    @media (max-width: 420px) { .value { font-size: 15px; } .card { padding: 18px 16px; } }
    .value a:hover { text-decoration: underline; }
    .back { display: inline-block; margin-top: 28px; background: #fa8900; color: #fff; font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 8px; }
    footer { text-align: center; font-size: 13px; color: #555; padding: 24px 16px 40px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html"><img src="assets/bem-materno-logo.png" alt="Bem Materno" width="1241" height="535"></a>
  </header>
  <main>
    <h1>Informações de contato</h1>
    <p class="lead">Ficou com alguma dúvida sobre o seu pedido ou sobre a almofada? Fale com a gente.</p>
    <div class="card">
      <div class="item">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
        <div>
          <p class="label">E-mail</p>
          <p class="value"><a href="mailto:suporte@bemmaterno.com.br">suporte@bemmaterno.com.br</a></p>
        </div>
      </div>
      <div class="item">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <div>
          <p class="label">Horário de atendimento</p>
          <p class="value">Das 08h às 16h</p>
        </div>
      </div>
    </div>
    <a class="back" href="index.html">Voltar para a loja</a>
  </main>
  <footer>© 2026, Bem Materno</footer>
</body>
</html>
